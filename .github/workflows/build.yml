name: Build Linux server binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev curl

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure PyO3 and linker paths
        run: |
          # Указываем PyO3, какой питон использовать
          echo "PYO3_PYTHON=$(which python3.13)" >> $GITHUB_ENV
          
          # Надежно получаем путь к libpython3.13.so прямо из Python
          LIB_DIR=$(python3.13 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          echo "LD_LIBRARY_PATH=${LIB_DIR}:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          
          # Передаем флаги линкеру (чтобы он нашел библиотеку)
          echo "RUSTFLAGS=-C link-arg=-L${LIB_DIR} -C link-arg=-lpython3.13" >> $GITHUB_ENV

      - name: Install Python packages
        run: |
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install firebase-admin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Copy Python helper
        run: cp src/fcm_helper.py target/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: |
            target/release/start2
            target/release/fcm_helper.py