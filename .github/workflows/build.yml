name: Build Linux server binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          
          sudo apt-get update
          sudo apt-get install -y  pkg-config libssl-dev curl

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set PyO3 Env Vars
        run: |
          # Указываем PyO3, какой питон использовать
          echo "PYO3_PYTHON=$(which python3.13)" >> $GITHUB_ENV

          # Находим, куда setup-python положил libpython3.13.so, и добавляем в LD_LIBRARY_PATH
          LIB_DIR=$(dirname $(find /opt/hostedtoolcache/Python -name "libpython3.13.so" | head -n 1))
          echo "LD_LIBRARY_PATH=$LIB_DIR" >> $GITHUB_ENV


      - name: Install pip and firebase-admin
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.13
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install firebase-admin

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build release binary
        env:
          PYO3_PYTHON: /usr/bin/python3.13
          RUSTFLAGS: "-C link-args=-lpython3.13"
        run: cargo build --release

      - name: Copy Python helper
        run: cp src/fcm_helper.py target/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: |
            target/release/start2
            target/release/fcm_helper.py