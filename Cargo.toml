[package]
name = "start2"
version = "0.1.0"
edition = "2024"

[dependencies]
# Криптография
x25519-dalek = "2.0"
rand = "0.8"
aes-gcm = "0.10"              # Вместо aes + cbc
hkdf = "0.12"
sha2 = "0.10"
bcrypt = "0.15"

# Асинхронность и сеть
tokio = { version = "1", features = ["full", "signal"] }
tokio-tungstenite = "0.21"
tungstenite = "0.29.0"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }   # (для возможного расширения)

# HTTP-клиент для FCM
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
jsonwebtoken = "8"
pyo3 = { version = "0.23", features = ["extension-module", "auto-initialize"] }

# Работа с данными (POSTGRES)
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"

# Логирование
env_logger = "0.10"
log = "0.4"
hex = "0.4.3"
dashmap = "5.5.3"
dotenvy = "0.15.7"