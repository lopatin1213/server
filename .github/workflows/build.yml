name: Build Linux server binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Python + libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip libpython3-dev pkg-config libssl-dev

      - name: Install Python dependencies (firebase-admin)
        run: |
          pip3 install --upgrade pip
          pip3 install firebase-admin

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      # Явно указываем системный Python, чтобы PyO3 нашёл правильные заголовки и библиотеку
      - name: Build release binary
        env:
          PYO3_PYTHON: /usr/bin/python3
        run: cargo build --release

      - name: Copy Python helper
        run: cp fcm_helper.py target/release/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: |
            target/release/start2           # замените на имя вашего бинарника
            target/release/fcm_helper.py