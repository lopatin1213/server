name: Build Linux server binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.13-dev libpython3.13-dev pkg-config libssl-dev

      - name: Install pip and firebase-admin
        run: |
          python3.13 -m ensurepip --upgrade
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install firebase-admin

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build release binary
        env:
          PYO3_PYTHON: /usr/bin/python3.13
          RUSTFLAGS: "-C link-args=-lpython3.13"
        run: cargo build --release

      - name: Copy Python helper
        run: cp src/fcm_helper.py target/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: |
            target/release/start2
            target/release/fcm_helper.py