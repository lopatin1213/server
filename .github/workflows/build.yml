name: Build Linux server binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.13-dev libpython3.13-dev pkg-config libssl-dev curl sshpass

      - name: Install pip and firebase-admin
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.13
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install firebase-admin

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build release binary
        env:
          PYO3_PYTHON: /usr/bin/python3.13
          RUSTFLAGS: "-C link-args=-lpython3.13"
        run: cargo build --release

      - name: Copy Python helper
        run: cp src/fcm_helper.py target/release/

      - name: Deploy to server via SCP
        env:
          # Используйте секрет, а не пароль в открытом виде
          SSH_PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # Отключаем проверку известных хостов для автоматизации (можно улучшить)
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no \
            target/release/start2 \
            target/release/fcm_helper.py \
            vartchat@ssh-vartchat.alwaysdata.net:~/
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no vartchat@ssh-vartchat.alwaysdata.net \
            "chmod +x ~/start2"
