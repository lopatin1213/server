name: Build Linux server binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip libpython3-dev pkg-config libssl-dev

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install firebase-admin

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build release binary
        env:
          PYO3_PYTHON: /usr/bin/python3
          RUSTFLAGS: "-C link-args=-lpython3.12"   # явно указываем библиотеку Python
        run: cargo build --release

      - name: Copy Python helper
        run: cp src/fcm_helper.py target/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: |
            target/release/start2
            target/release/fcm_helper.py